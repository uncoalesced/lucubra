[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/uncoalesced/lucubra"
publish = false

[workspace.dependencies]
lucubra-core = { path = "crates/lucubra-core", version = "0.0.1" }
lucubra-ingest = { path = "crates/lucubra-ingest", version = "0.0.1" }
lucubra-mcp = { path = "crates/lucubra-mcp", version = "0.0.1" }
lucubra-pack = { path = "crates/lucubra-pack", version = "0.0.1" }
lucubra-companion = { path = "crates/lucubra-companion", version = "0.0.1" }
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = "1"
blake3 = "1"
directories = "6"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
proptest = "1"
csv = "1"
unicode-normalization = "0.1"
calamine = "0.38"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = "0.42"
notify = "8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
